<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121110">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FilmCam — กล้องฟิล์มฟรี</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sriracha&family=Mali:wght@600&family=Kanit:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#121110;--panel:#24211e;--line:#3a3530;--ink:#f2ede4;--mute:#a49b8f;--amber:#f2a93b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;user-select:none;-webkit-user-select:none}
button{font:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 10px) 12px 6px}
.counter{background:#d9d2c3;color:#1a1714;font:700 17px ui-monospace,Menlo,monospace;padding:5px 9px;border-radius:6px;box-shadow:inset 0 2px 5px #0007;min-width:50px;text-align:center;border:none}
.brand{flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;font-size:16px;padding:0;flex:none}
.iconbtn.on{background:var(--amber);color:#1a1714;border-color:var(--amber)}
.iconbtn small{font-size:11px;font-weight:700}
.vf-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 14px;min-height:0}
.vf{position:relative;overflow:hidden;border-radius:4px;background:#000;box-shadow:0 0 0 3px #000,0 0 0 5px #2c2824;touch-action:none}
.vf video,.vf canvas#live,.vf #ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center}
.vf canvas#live{display:none}
.vf #ghost{opacity:.42;display:none;pointer-events:none}
.vf .vig,.vf .grid,.vf .circle{position:absolute;inset:0;pointer-events:none}
.vf .grid{background:linear-gradient(90deg,transparent 33.1%,#fff3 33.3%,transparent 33.5%,transparent 66.4%,#fff3 66.6%,transparent 66.8%),linear-gradient(180deg,transparent 33.1%,#fff3 33.3%,transparent 33.5%,transparent 66.4%,#fff3 66.6%,transparent 66.8%)}
.vf .circle{border-radius:50%;box-shadow:0 0 0 999px #000;display:none}
.vf .stamp{position:absolute;right:6%;bottom:5%;font:600 15px ui-monospace,Menlo,monospace;color:#ff8a2a;text-shadow:0 0 5px #ff6a00;letter-spacing:2px;opacity:.85;pointer-events:none}
.vf .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mute);font-size:14px;line-height:1.6}
.vf .dev{position:absolute;inset:0;display:none;place-items:center;background:#000a;font-size:14px;color:var(--amber);letter-spacing:1px}
.vf .ring{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border:2px solid var(--amber);border-radius:10px;opacity:0;pointer-events:none;transition:opacity .4s,transform .3s;transform:scale(1.3)}
.vf .ring.show{opacity:1;transform:scale(1)}
.vf .ev{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#000a;color:var(--amber);padding:4px 12px;border-radius:14px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
.vf .ev.show{opacity:1}
.vf .count{position:absolute;inset:0;display:none;place-items:center;font-size:90px;font-weight:800;color:#fff;text-shadow:0 4px 20px #000;pointer-events:none}
.vf .dbl{position:absolute;top:10px;left:10px;background:var(--amber);color:#1a1714;font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;display:none;pointer-events:none}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
.selectors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 14px 4px}
.sel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 6px;color:var(--ink);text-align:center;min-width:0}
.sel small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--mute)}
.sel b{display:block;font-size:13px;color:var(--amber);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{text-align:center;font-size:11px;color:#6f675d;padding:2px}
.bottom{display:flex;align-items:center;justify-content:space-around;padding:8px 20px calc(env(safe-area-inset-bottom) + 16px)}
.shutter{width:80px;height:80px;border-radius:50%;border:5px solid #d9d2c3;background:radial-gradient(circle at 40% 35%,#fff,#e6e0d4);box-shadow:0 0 0 3px #000 inset,0 4px 14px #0008;padding:0}
.shutter:active{transform:scale(.92)}
.thumb{width:54px;height:54px;border-radius:10px;border:2px solid var(--line);background:#000 center/cover no-repeat;padding:0;font-size:24px}
.scrim{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86dvh;background:#1b1917;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .28s;z-index:45;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#555;margin:10px auto 0;flex:none}
.sheet h3{margin:0;padding:10px 18px 8px;font-size:16px;flex:none}
#sheetBody{overflow:auto;min-height:0}
.opts{padding:4px 14px 22px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt .more{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:#0006;display:grid;place-items:center;font-size:14px}
.opt{position:relative;background:var(--panel);border:2px solid transparent;border-radius:14px;padding:10px 6px;color:var(--ink);text-align:center}
.opt.active{border-color:var(--amber);background:#2e2924}
.opt .ic{font-size:28px;height:46px;display:grid;place-items:center}
.can{width:30px;height:44px;margin:0 auto 4px;border-radius:5px;box-shadow:inset -4px 0 6px #0005}
.opt b{font-size:12px;display:block}
.opt span{font-size:10px;color:var(--mute);display:block;margin-top:2px}
.rows{padding:4px 18px 22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--amber);flex:none}
.row select,.row input[type=date]{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;color-scheme:dark}
.row input[type=range]{flex:1;accent-color:var(--amber);max-width:58%}
.row .val{width:42px;text-align:right;color:var(--amber);font-size:13px}
.note{font-size:12px;color:var(--mute);line-height:1.6;padding-top:12px}
.bigbtn{display:block;width:100%;margin-top:14px;padding:14px;border-radius:12px;border:none;background:var(--amber);color:#1a1714;font-weight:700;font-size:15px}
.bigbtn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.full{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
.full.open{display:flex}
.fhead{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;flex:none}
.fhead h2{flex:1;margin:0;font-size:17px}
.fhead .txtbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:18px;padding:7px 14px;font-size:13px}
.fhead .txtbtn.on{background:var(--amber);color:#1a1714;border-color:var(--amber)}
.ggrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;align-content:start}
.tile{position:relative;aspect-ratio:1;background:#222;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile.locked{display:grid;place-items:center;text-align:center;font-size:11px;color:var(--mute);background:repeating-linear-gradient(45deg,#1c1a18 0 10px,#211e1b 10px 20px)}
.tile.locked b{display:block;font-size:26px}
.tile .badge{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:#0006;color:#1a1714;font-size:12px;font-weight:800;display:grid;place-items:center}
.tile.picked .badge{background:var(--amber);border-color:var(--amber)}
.tile.picked img{opacity:.75}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 20px;font-size:14px}
.selbar{display:none;gap:10px;padding:10px 14px calc(env(safe-area-inset-bottom) + 14px);flex:none}
.selbar.show{display:flex}
.selbar button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.selbar .pri{background:var(--amber);color:#1a1714;border-color:var(--amber);font-weight:700}
.viewer{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0}
.viewer img,.viewer canvas{max-width:100%;max-height:100%;box-shadow:0 6px 30px #000;object-fit:contain}
.vmeta{text-align:center;font-size:12px;color:var(--mute);padding:4px;flex:none}
.vbar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:10px 10px calc(env(safe-area-inset-bottom) + 14px);flex:none}
.vbar button{padding:9px 1px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:10px;line-height:1.5}
.vbar button i{display:block;font-style:normal;font-size:19px}
.vbar button:disabled{opacity:.35}
.tabs{display:flex;gap:4px;padding:6px 14px 4px;flex:none}
.tabs button{flex:1;padding:8px;border-radius:10px;border:none;background:transparent;color:var(--mute);font-size:13px}
.tabs button.on{background:var(--panel);color:var(--amber);font-weight:700}
.edpanel{flex:none;height:200px;overflow:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:74px;background:var(--panel);border:2px solid transparent;border-radius:12px;padding:8px 8px;color:var(--ink);text-align:center;font-size:11px}
.chip.active{border-color:var(--amber)}
.chip .ic{font-size:22px;display:block;height:30px}
.chip .can{width:20px;height:30px}
.minichips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0}
.minichips button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:6px 12px;font-size:12px}
.minichips button.active{background:var(--amber);color:#1a1714;border-color:var(--amber);font-weight:700}
.lbl{font-size:12px;color:var(--mute);margin-top:10px}
.prev{display:flex;justify-content:center;padding:6px 0;background:#0c0b0a;border-radius:12px;margin:4px 0 6px}
.prev canvas{max-width:100%;max-height:34dvh;display:block}
.modes>:first-child{margin-left:auto}
.modes>:last-child{margin-right:auto}
.modes{display:flex;gap:4px;justify-content:flex-start;overflow-x:auto;padding:4px 10px 0;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:none;background:none;border:none;color:var(--mute);font-size:13px;padding:6px 10px;border-radius:14px;letter-spacing:.5px}
.modes button.on{color:#1a1714;background:var(--amber);font-weight:700}
.shutter.vid{background:radial-gradient(circle,#e5372f 0 55%,#f4f1ea 57%)}
.shutter.rec{background:radial-gradient(circle,#e5372f 0 30%,#f4f1ea 32%);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px #000 inset,0 0 0 8px #e5372f55}}
.vf .recl{position:absolute;top:10px;right:10px;background:#e5372f;color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;display:none}
.sel.locked{opacity:.45}
.tile .play{position:absolute;left:6px;bottom:6px;background:#000a;color:#fff;font-size:11px;padding:2px 7px;border-radius:8px}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.albrow{flex:none;display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.albrow::-webkit-scrollbar{display:none}
.albrow button{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:6px 12px;font-size:12px}
.albrow button.on{background:var(--amber);color:#1a1714;border-color:var(--amber);font-weight:700}
.albnote{flex:none;font-size:11px;color:var(--mute);padding:0 14px 6px}
.viewer video{max-width:100%;max-height:100%}
.txtin{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px}
.stk{font-size:24px;background:var(--panel);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;padding:0}
.reveal{position:fixed;inset:0;z-index:55;background:radial-gradient(circle at 50% 40%,#2a2622,#0c0b0a);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px}
.reveal.open{display:flex}
.reveal img{max-width:82%;max-height:70dvh;box-shadow:0 18px 50px #000c;transform:rotate(-2deg);animation:pop .5s ease-out}
@keyframes pop{from{transform:translateY(60px) rotate(-6deg);opacity:0}}
.revhint{color:var(--mute);font-size:13px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="top">
  <button class="counter" id="counter" title="ม้วนฟิล์ม">36</button>
  <div class="brand"></div>
  <button class="iconbtn" id="btnDbl" title="ภาพซ้อน">◎</button>
  <button class="iconbtn" id="btnTimer" title="ตั้งเวลา">⏱</button>
  <button class="iconbtn" id="btnTorch" title="แฟลช" style="display:none">⚡</button>
  <button class="iconbtn" id="btnImport" title="นำเข้ารูป">🖼️</button>
  <button class="iconbtn" id="btnSettings" title="ตั้งค่า">⚙️</button>
</div>

<div class="vf-wrap" id="wrap">
  <div class="vf" id="vf">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="live"></canvas>
    <img id="ghost" alt="">
    <div class="vig" id="vig"></div>
    <div class="grid" id="grid"></div>
    <div class="circle" id="circle"></div>
    <div class="stamp" id="stamp"></div>
    <div class="ring" id="ring"></div>
    <div class="ev" id="evLbl"></div>
    <div class="dbl" id="dblLbl">ภาพซ้อน 1/2</div>
    <div class="count" id="count"></div>
    <div class="recl" id="recLbl">● REC 0:00</div>
    <div class="msg" id="msg">กำลังเปิดกล้อง…</div>
    <div class="dev" id="dev">กำลังล้างฟิล์ม…</div>
  </div>
</div>

<div class="selectors">
  <button class="sel" data-kind="cam"><small>CAMERA</small><b id="lblCam"></b></button>
  <button class="sel" data-kind="lens"><small>LENS</small><b id="lblLens"></b></button>
  <button class="sel" data-kind="film"><small>FILM</small><b id="lblFilm"></b></button>
</div>
<div class="hint" id="hint"></div>
<div class="modes" id="modes"></div>

<div class="bottom">
  <button class="thumb" id="thumb" title="อัลบั้ม"></button>
  <button class="shutter" id="shutter" title="ถ่าย"></button>
  <button class="iconbtn" id="btnFlip" title="สลับกล้อง" style="width:54px;height:54px;font-size:22px">🔄</button>
</div>

<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="refIn" accept="image/*" hidden>
<input type="file" id="zipIn" accept=".zip,application/zip" hidden>
<div class="flash" id="flash"></div>

<!-- Gallery -->
<div class="full" id="gallery">
  <div class="fhead"><button class="iconbtn" id="gClose">←</button><h2>อัลบั้มฟิล์ม <span id="gCount" style="color:var(--mute);font-size:13px;font-weight:400"></span></h2><button class="txtbtn" id="gSelect">รวมรูป</button></div>
  <div class="albrow" id="albRow"></div>
  <div class="albnote" id="albNote"></div>
  <div class="ggrid" id="ggrid"></div>
  <div class="selbar" id="selbar"><button id="selCancel">ยกเลิก</button><button class="pri" id="selGo">รวมรูป (0)</button></div>
</div>

<!-- Viewer -->
<div class="full" id="viewerWrap" style="z-index:32">
  <div class="fhead"><button class="iconbtn" id="vClose">←</button><h2 id="vTitle"></h2></div>
  <div class="viewer"><img id="vImg" alt=""><video id="vVid" controls playsinline loop style="display:none"></video></div>
  <div class="vmeta" id="vMeta"></div>
  <div class="vbar">
    <button id="vSave"><i>⬇️</i>บันทึก</button>
    <button id="vShare"><i>📤</i>แชร์</button>
    <button id="vEdit"><i>🎨</i>แต่งใหม่</button>
    <button id="vPost"><i>✨</i>ทำเพิ่ม</button>
    <button id="vAlb"><i>📁</i>อัลบั้ม</button>
    <button id="vDel"><i>🗑️</i>ลบ</button>
  </div>
</div>

<!-- Editor -->
<div class="full" id="editor" style="z-index:34">
  <div class="fhead"><button class="iconbtn" id="eClose">←</button><h2>แต่งรูป</h2></div>
  <div class="viewer" id="eView"></div>
  <div class="tabs" id="eTabs">
    <button data-t="film" class="on">ฟิล์ม</button><button data-t="cam">กล้อง</button><button data-t="lens">เลนส์</button><button data-t="adj">ปรับ</button><button data-t="txt">ข้อความ</button>
  </div>
  <div class="edpanel" id="ePanel"></div>
  <div class="selbar show"><button id="eReplace">แทนที่รูปเดิม</button><button class="pri" id="eSaveNew">บันทึกเป็นรูปใหม่</button></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3 id="sheetTitle"></h3>
  <div id="sheetBody"></div>
</div>
<div class="reveal" id="reveal"><img id="revImg" alt=""><div class="revhint">เขย่ามือถือให้ภาพขึ้นเร็วขึ้น · แตะเพื่อข้าม</div></div>
<div class="toast" id="toast"></div>

<script src="app.js" defer></script>
</body>
</html>
