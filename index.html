<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121110">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FilmCam — กล้องฟิล์มฟรี</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#121110;--panel:#24211e;--line:#3a3530;--ink:#f2ede4;--mute:#a49b8f;--amber:#f2a93b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;user-select:none;-webkit-user-select:none}
button{font:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 10px) 12px 6px}
.counter{background:#d9d2c3;color:#1a1714;font:700 17px ui-monospace,Menlo,monospace;padding:5px 9px;border-radius:6px;box-shadow:inset 0 2px 5px #0007;min-width:50px;text-align:center;border:none}
.brand{flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;font-size:16px;padding:0;flex:none}
.iconbtn.on{background:var(--amber);color:#1a1714;border-color:var(--amber)}
.iconbtn small{font-size:11px;font-weight:700}
.vf-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 14px;min-height:0}
.vf{position:relative;overflow:hidden;border-radius:4px;background:#000;box-shadow:0 0 0 3px #000,0 0 0 5px #2c2824;touch-action:none}
.vf video,.vf canvas#live,.vf #ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:center}
.vf canvas#live{display:none}
.vf #ghost{opacity:.42;display:none;pointer-events:none}
.vf .vig,.vf .grid,.vf .circle{position:absolute;inset:0;pointer-events:none}
.vf .grid{background:linear-gradient(90deg,transparent 33.1%,#fff3 33.3%,transparent 33.5%,transparent 66.4%,#fff3 66.6%,transparent 66.8%),linear-gradient(180deg,transparent 33.1%,#fff3 33.3%,transparent 33.5%,transparent 66.4%,#fff3 66.6%,transparent 66.8%)}
.vf .circle{border-radius:50%;box-shadow:0 0 0 999px #000;display:none}
.vf .stamp{position:absolute;right:6%;bottom:5%;font:600 15px ui-monospace,Menlo,monospace;color:#ff8a2a;text-shadow:0 0 5px #ff6a00;letter-spacing:2px;opacity:.85;pointer-events:none}
.vf .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mute);font-size:14px;line-height:1.6}
.vf .dev{position:absolute;inset:0;display:none;place-items:center;background:#000a;font-size:14px;color:var(--amber);letter-spacing:1px}
.vf .ring{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border:2px solid var(--amber);border-radius:10px;opacity:0;pointer-events:none;transition:opacity .4s,transform .3s;transform:scale(1.3)}
.vf .ring.show{opacity:1;transform:scale(1)}
.vf .ev{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#000a;color:var(--amber);padding:4px 12px;border-radius:14px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
.vf .ev.show{opacity:1}
.vf .count{position:absolute;inset:0;display:none;place-items:center;font-size:90px;font-weight:800;color:#fff;text-shadow:0 4px 20px #000;pointer-events:none}
.vf .dbl{position:absolute;top:10px;left:10px;background:var(--amber);color:#1a1714;font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;display:none;pointer-events:none}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
.selectors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 14px 4px}
.sel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 6px;color:var(--ink);text-align:center;min-width:0}
.sel small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--mute)}
.sel b{display:block;font-size:13px;color:var(--amber);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{text-align:center;font-size:11px;color:#6f675d;padding:2px}
.bottom{display:flex;align-items:center;justify-content:space-around;padding:8px 20px calc(env(safe-area-inset-bottom) + 16px)}
.shutter{width:80px;height:80px;border-radius:50%;border:5px solid #d9d2c3;background:radial-gradient(circle at 40% 35%,#fff,#e6e0d4);box-shadow:0 0 0 3px #000 inset,0 4px 14px #0008;padding:0}
.shutter:active{transform:scale(.92)}
.thumb{width:54px;height:54px;border-radius:10px;border:2px solid var(--line);background:#000 center/cover no-repeat;padding:0;font-size:24px}
.scrim{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86dvh;background:#1b1917;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .28s;z-index:45;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#555;margin:10px auto 0;flex:none}
.sheet h3{margin:0;padding:10px 18px 8px;font-size:16px;flex:none}
#sheetBody{overflow:auto;min-height:0}
.opts{padding:4px 14px 22px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{background:var(--panel);border:2px solid transparent;border-radius:14px;padding:10px 6px;color:var(--ink);text-align:center}
.opt.active{border-color:var(--amber);background:#2e2924}
.opt .ic{font-size:28px;height:46px;display:grid;place-items:center}
.can{width:30px;height:44px;margin:0 auto 4px;border-radius:5px;box-shadow:inset -4px 0 6px #0005}
.opt b{font-size:12px;display:block}
.opt span{font-size:10px;color:var(--mute);display:block;margin-top:2px}
.rows{padding:4px 18px 22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--amber);flex:none}
.row select,.row input[type=date]{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;color-scheme:dark}
.row input[type=range]{flex:1;accent-color:var(--amber);max-width:58%}
.row .val{width:42px;text-align:right;color:var(--amber);font-size:13px}
.note{font-size:12px;color:var(--mute);line-height:1.6;padding-top:12px}
.bigbtn{display:block;width:100%;margin-top:14px;padding:14px;border-radius:12px;border:none;background:var(--amber);color:#1a1714;font-weight:700;font-size:15px}
.bigbtn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.full{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
.full.open{display:flex}
.fhead{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;flex:none}
.fhead h2{flex:1;margin:0;font-size:17px}
.fhead .txtbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:18px;padding:7px 14px;font-size:13px}
.fhead .txtbtn.on{background:var(--amber);color:#1a1714;border-color:var(--amber)}
.ggrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;align-content:start}
.tile{position:relative;aspect-ratio:1;background:#222;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile.locked{display:grid;place-items:center;text-align:center;font-size:11px;color:var(--mute);background:repeating-linear-gradient(45deg,#1c1a18 0 10px,#211e1b 10px 20px)}
.tile.locked b{display:block;font-size:26px}
.tile .badge{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:#0006;color:#1a1714;font-size:12px;font-weight:800;display:grid;place-items:center}
.tile.picked .badge{background:var(--amber);border-color:var(--amber)}
.tile.picked img{opacity:.75}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 20px;font-size:14px}
.selbar{display:none;gap:10px;padding:10px 14px calc(env(safe-area-inset-bottom) + 14px);flex:none}
.selbar.show{display:flex}
.selbar button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.selbar .pri{background:var(--amber);color:#1a1714;border-color:var(--amber);font-weight:700}
.viewer{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0}
.viewer img,.viewer canvas{max-width:100%;max-height:100%;box-shadow:0 6px 30px #000;object-fit:contain}
.vmeta{text-align:center;font-size:12px;color:var(--mute);padding:4px;flex:none}
.vbar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 10px calc(env(safe-area-inset-bottom) + 14px);flex:none}
.vbar button{padding:9px 2px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:11px;line-height:1.5}
.vbar button i{display:block;font-style:normal;font-size:19px}
.vbar button:disabled{opacity:.35}
.tabs{display:flex;gap:4px;padding:6px 14px 4px;flex:none}
.tabs button{flex:1;padding:8px;border-radius:10px;border:none;background:transparent;color:var(--mute);font-size:13px}
.tabs button.on{background:var(--panel);color:var(--amber);font-weight:700}
.edpanel{flex:none;height:190px;overflow:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:74px;background:var(--panel);border:2px solid transparent;border-radius:12px;padding:8px 8px;color:var(--ink);text-align:center;font-size:11px}
.chip.active{border-color:var(--amber)}
.chip .ic{font-size:22px;display:block;height:30px}
.chip .can{width:20px;height:30px}
.minichips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0}
.minichips button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:6px 12px;font-size:12px}
.minichips button.active{background:var(--amber);color:#1a1714;border-color:var(--amber);font-weight:700}
.lbl{font-size:12px;color:var(--mute);margin-top:10px}
.prev{display:flex;justify-content:center;padding:6px 0;background:#0c0b0a;border-radius:12px;margin:4px 0 6px}
.prev canvas{max-width:100%;max-height:34dvh;display:block}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="top">
  <button class="counter" id="counter" title="ม้วนฟิล์ม">36</button>
  <div class="brand"></div>
  <button class="iconbtn" id="btnDbl" title="ภาพซ้อน">◎</button>
  <button class="iconbtn" id="btnTimer" title="ตั้งเวลา">⏱</button>
  <button class="iconbtn" id="btnTorch" title="แฟลช" style="display:none">⚡</button>
  <button class="iconbtn" id="btnImport" title="นำเข้ารูป">🖼️</button>
  <button class="iconbtn" id="btnSettings" title="ตั้งค่า">⚙️</button>
</div>

<div class="vf-wrap" id="wrap">
  <div class="vf" id="vf">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="live"></canvas>
    <img id="ghost" alt="">
    <div class="vig" id="vig"></div>
    <div class="grid" id="grid"></div>
    <div class="circle" id="circle"></div>
    <div class="stamp" id="stamp"></div>
    <div class="ring" id="ring"></div>
    <div class="ev" id="evLbl"></div>
    <div class="dbl" id="dblLbl">ภาพซ้อน 1/2</div>
    <div class="count" id="count"></div>
    <div class="msg" id="msg">กำลังเปิดกล้อง…</div>
    <div class="dev" id="dev">กำลังล้างฟิล์ม…</div>
  </div>
</div>

<div class="selectors">
  <button class="sel" data-kind="cam"><small>CAMERA</small><b id="lblCam"></b></button>
  <button class="sel" data-kind="lens"><small>LENS</small><b id="lblLens"></b></button>
  <button class="sel" data-kind="film"><small>FILM</small><b id="lblFilm"></b></button>
</div>
<div class="hint">แตะจอเพื่อโฟกัส · ลากขึ้น/ลงเพื่อปรับแสง · แตะสองครั้งรีเซ็ตแสง</div>

<div class="bottom">
  <button class="thumb" id="thumb" title="อัลบั้ม"></button>
  <button class="shutter" id="shutter" title="ถ่าย"></button>
  <button class="iconbtn" id="btnFlip" title="สลับกล้อง" style="width:54px;height:54px;font-size:22px">🔄</button>
</div>

<input type="file" id="fileIn" accept="image/*" multiple hidden>
<div class="flash" id="flash"></div>

<!-- Gallery -->
<div class="full" id="gallery">
  <div class="fhead"><button class="iconbtn" id="gClose">←</button><h2>อัลบั้มฟิล์ม <span id="gCount" style="color:var(--mute);font-size:13px;font-weight:400"></span></h2><button class="txtbtn" id="gSelect">รวมรูป</button></div>
  <div class="ggrid" id="ggrid"></div>
  <div class="selbar" id="selbar"><button id="selCancel">ยกเลิก</button><button class="pri" id="selGo">รวมรูป (0)</button></div>
</div>

<!-- Viewer -->
<div class="full" id="viewerWrap" style="z-index:32">
  <div class="fhead"><button class="iconbtn" id="vClose">←</button><h2 id="vTitle"></h2></div>
  <div class="viewer"><img id="vImg" alt=""></div>
  <div class="vmeta" id="vMeta"></div>
  <div class="vbar">
    <button id="vSave"><i>⬇️</i>บันทึก</button>
    <button id="vShare"><i>📤</i>แชร์</button>
    <button id="vEdit"><i>🎨</i>แต่งใหม่</button>
    <button id="vPost"><i>📐</i>ลง IG</button>
    <button id="vDel"><i>🗑️</i>ลบ</button>
  </div>
</div>

<!-- Editor -->
<div class="full" id="editor" style="z-index:34">
  <div class="fhead"><button class="iconbtn" id="eClose">←</button><h2>แต่งรูป</h2></div>
  <div class="viewer" id="eView"></div>
  <div class="tabs" id="eTabs">
    <button data-t="film" class="on">ฟิล์ม</button><button data-t="cam">กล้อง</button><button data-t="lens">เลนส์</button><button data-t="adj">ปรับ</button>
  </div>
  <div class="edpanel" id="ePanel"></div>
  <div class="selbar show"><button id="eReplace">แทนที่รูปเดิม</button><button class="pri" id="eSaveNew">บันทึกเป็นรูปใหม่</button></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3 id="sheetTitle"></h3>
  <div id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>

/* tap focus + drag exposure */
(()=>{
 const vf=$('vf');let sy=0,ev0=0,moved=false,lastTap=0,down=false;
 const showEV=()=>{const e=$('evLbl');e.textContent=`☀ ${S.ev>0?'+':''}${S.ev.toFixed(1)}`;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1200)};
 vf.addEventListener('pointerdown',e=>{down=true;sy=e.clientY;ev0=S.ev;moved=false});
 vf.addEventListener('pointermove',e=>{if(!down)return;const dy=sy-e.clientY;if(Math.abs(dy)>10)moved=true;if(moved){S.ev=Math.round(Math.max(-2,Math.min(2,ev0+dy/110))*10)/10;applyUI();showEV()}});
 vf.addEventListener('pointerup',e=>{if(!down)return;down=false;if(moved)return;
  const now=Date.now();if(now-lastTap<300){S.ev=0;applyUI();showEV();lastTap=0;return}lastTap=now;
  const r=vf.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
  const ring=$('ring');ring.style.left=(px*100)+'%';ring.style.top=(py*100)+'%';ring.classList.remove('show');void ring.offsetWidth;ring.classList.add('show');
  clearTimeout(ring._t);ring._t=setTimeout(()=>ring.classList.remove('show'),900);
  focusAt(px,py);
 });
 vf.addEventListener('pointercancel',()=>down=false);
})();
async function focusAt(px,py){
 if(!track||!video.videoWidth)return;
 const vw=video.videoWidth,vh=video.videoHeight,cr=cropRect(vw,vh,S.cam.aspect,S.lens.zoom||1);
 if(S.facing==='user')px=1-px;
 const x=(cr.x+px*cr.w)/vw,y=(cr.y+py*cr.h)/vh;
 const caps=track.getCapabilities?track.getCapabilities():{};const adv={pointsOfInterest:[{x,y}]};
 if(caps.focusMode&&caps.focusMode.includes('single-shot'))adv.focusMode='single-shot';
 else if(caps.focusMode&&caps.focusMode.includes('continuous'))adv.focusMode='continuous';
 if(caps.exposureMode&&caps.exposureMode.includes('continuous'))adv.exposureMode='continuous';
 try{await track.applyConstraints({advanced:[adv]})}catch(e){}
}

let actx=null;
function click(){
 if(!S.sound)return;
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const n=actx.sampleRate*.09|0,b=actx.createBuffer(1,n,actx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++){const t=i/n;d[i]=(Math.random()*2-1)*(t<.15?1:t<.35?.15:t<.5?.8:.05)*(1-t)}
  const s=actx.createBufferSource();s.buffer=b;const g=actx.createGain();g.gain.value=.5;s.connect(g).connect(actx.destination);s.start()}catch(e){}
}
function beep(){if(!S.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.06)}catch(e){}}

function grabFrame(){
 const vw=video.videoWidth,vh=video.videoHeight,g=mk(vw,vh),x=g.getContext('2d');
 if(S.facing==='user'){x.translate(vw,0);x.scale(-1,1)}
 x.drawImage(video,0,0,vw,vh);return g;
}
function blendDouble(a,b){
 const c=mk(a.width,a.height),x=c.getContext('2d');x.drawImage(a,0,0);
 x.globalCompositeOperation='screen';x.globalAlpha=.85;
 const s=Math.max(a.width/b.width,a.height/b.height),w=b.width*s,h=b.height*s;x.drawImage(b,(a.width-w)/2,(a.height-h)/2,w,h);
 x.globalAlpha=1;x.globalCompositeOperation='source-over';return c;
}

const DB=new Promise((res,rej)=>{try{const r=indexedDB.open('filmcam',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});

function isReady(r){

 if(r.lock.t==='time')return Date.now()>=r.lock.until;
 if(r.lock.t==='roll')return r.lock.roll<S.rollId||(r.lock.roll===S.rollId&&S.roll>0&&S.left<=0);

async function saveShot(raw,o,w,h,imported){
 const out=develop(raw,w,h,o);
 const [blob,orig]=await Promise.all([toBlob(out),toBlob(downscale(raw,2560),.9)]);
 const rec={kind:'photo',ts:Date.now(),blob,orig,o,...metaOf(o)};
 if(!imported&&S.devMode==='hour')rec.lock={t:'time',until:Date.now()+3600e3};
 if(!imported&&S.devMode==='roll')rec.lock={t:'roll',roll:S.rollId};
 try{rec.id=await store('readwrite',s=>s.add(rec))}catch(e){toast('เก็บในอัลบั้มไม่ได้ — ดาวน์โหลดให้แทน');download(rec);return}
 if(rec.lock)toast(S.devMode==='hour'?'ส่งล้างแล้ว ⏳ รอ 1 ชั่วโมง':`ส่งล้างแล้ว ⏳ รอหมดม้วน`);
 else if(S.autosave)download(rec);
 loadThumb();
}

let thumbURL=null;

 if(last&&!isReady(last)){t.style.backgroundImage='none';t.textContent='⏳';return}

function fname(r){const d=new Date(r.ts);return `FilmCam_${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}.jpg`}
function download(r){const u=URL.createObjectURL(r.blob),a=document.createElement('a');a.href=u;a.download=fname(r);document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}

$('gSelect').onclick=()=>setSel(!selMode);
$('selCancel').onclick=()=>setSel(false);
$('selGo').onclick=()=>{if(picked.length<2){toast('เลือกอย่างน้อย 2 รูป');return}openCollage(picked.slice())};
$('thumb').onclick=()=>{setSel(false)};
$('gClose').onclick=()=>{$('gallery').classList.remove('open');selMode=false};

function openViewer(r){
 cur=r;if(curURL)URL.revokeObjectURL(curURL);curURL=URL.createObjectURL(r.blob);$('vImg').src=curURL;
 $('vTitle').textContent=r.kind==='collage'?'ภาพรวม':r.kind==='post'?'ภาพสำหรับลง IG':r.film;
 $('vMeta').textContent=(r.kind==='photo'?`${r.cam} · ${r.lens} · `:'')+new Date(r.ts).toLocaleString('th-TH');
 $('vEdit').disabled=!r.orig;$('viewerWrap').classList.add('open');
}
$('vClose').onclick=()=>$('viewerWrap').classList.remove('open');
$('vSave').onclick=()=>{if(cur){download(cur);toast('กำลังดาวน์โหลด…')}};
$('vShare').onclick=()=>{if(cur)shareBlob(cur.blob,fname(cur))};
$('vEdit').onclick=()=>{if(cur&&cur.orig)openEditor(cur)};
$('vPost').onclick=()=>{if(cur)openPost(cur)};
let delArm=0;
$('vDel').onclick=async()=>{
 if(!cur)return;if(Date.now()-delArm>2500){delArm=Date.now();$('vDel').innerHTML='<i>⚠️</i>แตะอีกครั้ง';setTimeout(()=>$('vDel').innerHTML='<i>🗑️</i>ลบ',2500);return}
 delArm=0;$('vDel').innerHTML='<i>🗑️</i>ลบ';try{await store('readwrite',s=>s.delete(cur.id))}catch(e){}
 $('viewerWrap').classList.remove('open');openGallery();loadThumb();toast('ลบแล้ว');
};

/* ================= EDITOR (re-develop) ================= */
const E={rec:null,bmp:null,o:null,tab:'film',timer:0,busy:false};
async function openEditor(r){
 E.rec=r;E.o=Object.assign({I:1,grain:1,leak:false,dust:false,stamp:false,ev:0,frameNo:1},JSON.parse(JSON.stringify(r.o)),{mirror:false});
 if(!E.o.date)E.o.date=r.ts;
 $('editor').classList.add('open');$('eView').innerHTML='<div style="color:var(--mute)">กำลังโหลด…</div>';
 E.bmp=await blobToBmp(r.orig);setTab('film');renderEd();
}
function renderEd(){
 clearTimeout(E.timer);E.timer=setTimeout(()=>{
  if(!E.bmp)return;const c=develop(E.bmp,E.bmp.width,E.bmp.height,{...E.o,max:1000});
  $('eView').innerHTML='';$('eView').appendChild(c);
 },90);
}
function setTab(t){E.tab=t;document.querySelectorAll('#eTabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 const P=$('ePanel');P.innerHTML='';
 if(t!=='adj'){
  const list={film:FILMS,cam:CAMS,lens:LENSES}[t],box=el('<div class="chips"></div>');
  list.forEach(it=>{const b=el(`<button class="chip${E.o[t]===it.id?' active':''}"></button>`);
   b.innerHTML=(t==='film'?canSVG(it):`<span class="ic">${t==='lens'?(it.circle?'🐟':'🔘'):it.ic}</span>`)+it.name;
   b.onclick=()=>{E.o[t]=it.id;if(t==='cam'){E.o.leak=!!it.leak}box.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderEd()};box.appendChild(b)});
  P.appendChild(box);
  if(t==='film')P.appendChild(el('<div class="note" style="padding:0 16px">เลื่อนซ้าย-ขวาเพื่อดูฟิล์มทั้งหมด</div>'));
  setTimeout(()=>{const a=box.querySelector('.active');if(a)a.scrollIntoView({inline:'center',block:'nearest'})},0);
 }else{
  const box=el('<div class="rows" style="padding-top:0"></div>');
  rangeRow(box,'ความแรงฟิล์ม',0,1,.05,()=>E.o.I,v=>{E.o.I=v;renderEd()},v=>Math.round(v*100)+'%');
  rangeRow(box,'ความสว่าง',-2,2,.1,()=>E.o.ev,v=>{E.o.ev=v;renderEd()},v=>(v>0?'+':'')+v.toFixed(1));
  rangeRow(box,'เกรนฟิล์ม',0,3,.1,()=>E.o.grain,v=>{E.o.grain=v;renderEd()},v=>Math.round(v*100)+'%');
  const lk=toggleRow(box,'แสงรั่ว',()=>E.o.leak,v=>{E.o.leak=v;renderEd()});
  const rr=el('<button class="iconbtn" style="width:34px;height:34px;margin-left:auto" title="สุ่มใหม่">🎲</button>');rr.onclick=e=>{e.preventDefault();E.o.seed=newSeed();renderEd()};lk.insertBefore(rr,lk.lastChild);
  toggleRow(box,'ฝุ่นและรอยขีดข่วน',()=>E.o.dust,v=>{E.o.dust=v;renderEd()});
  toggleRow(box,'วันที่บนรูป',()=>E.o.stamp,v=>{E.o.stamp=v;renderEd()});
  const dr=el('<div class="row"><span>วันที่</span><input type="date"></div>'),di=dr.querySelector('input');
  const d0=new Date(E.o.date);di.value=`${d0.getFullYear()}-${pad2(d0.getMonth()+1)}-${pad2(d0.getDate())}`;
  di.onchange=()=>{if(di.value){E.o.date=+new Date(di.value+'T12:00:00');E.o.stamp=true;setTab('adj');renderEd()}};box.appendChild(dr);
  P.appendChild(box);
 }
}
document.querySelectorAll('#eTabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$('eClose').onclick=()=>{$('editor').classList.remove('open');E.bmp=null};
async function saveEd(replace){
 if(E.busy||!E.bmp)return;E.busy=true;toast('กำลังล้างรูป…');
 try{
  await sleep(30);const o={...E.o};delete o.max;
  const blob=await toBlob(develop(E.bmp,E.bmp.width,E.bmp.height,o));
  const rec={...E.rec,blob,o,...metaOf(o)};delete rec.lock;
  if(replace){await store('readwrite',s=>s.put(rec))}else{delete rec.id;rec.ts=Date.now();await addRecord(rec)}
  $('editor').classList.remove('open');E.bmp=null;loadThumb();await openGallery();openViewer(rec);toast(replace?'แทนที่รูปเดิมแล้ว':'บันทึกเป็นรูปใหม่แล้ว');
 }catch(e){console.error(e);toast('บันทึกไม่สำเร็จ')}
 E.busy=false;
}
$('eReplace').onclick=()=>saveEd(true);
$('eSaveNew').onclick=()=>saveEd(false);

/* ================= IG POST / COLLAGE ================= */
const RATIOS=[['4:5',4/5,'ฟีด 4:5'],['9:16',9/16,'สตอรี่ 9:16'],['1:1',1,'จัตุรัส 1:1']];
const BGS=[['#ffffff','ขาว'],['#f3efe6','ครีม'],['#111111','ดำ']];
function coverDraw(x,img,dx,dy,dw,dh){const s=Math.max(dw/img.width,dh/img.height),sw=dw/s,sh=dh/s;x.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,dx,dy,dw,dh)}
function composePost(img,ratio,bg,margin,W=1080){
 const H=Math.round(W/ratio),c=mk(W,H),x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,W,H);
 if(!margin){coverDraw(x,img,0,0,W,H);return c}
 const mw=W*(1-2*margin),mh=H*(1-2*margin),s=Math.min(mw/img.width,mh/img.height),dw=img.width*s,dh=img.height*s;
 x.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);return c;
}
function chipGroup(box,label,opts,get,set){
 box.appendChild(el(`<div class="lbl">${label}</div>`));const g=el('<div class="minichips"></div>');
 opts.forEach(([v,t])=>{const b=el(`<button${get()===v?' class="active"':''}>${t}</button>`);b.onclick=()=>{set(v);g.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};g.appendChild(b)});
 box.appendChild(g);
}
async function openPost(r){
 const img=await blobToBmp(r.blob),st={ratio:'4:5',bg:'#ffffff',margin:.06};
 const box=el('<div class="rows" style="padding-top:0"></div>'),prev=el('<div class="prev"></div>');box.appendChild(prev);
 let out=null;
 const draw=()=>{out=composePost(img,RATIOS.find(x=>x[0]===st.ratio)[1],st.bg,st.margin);prev.innerHTML='';prev.appendChild(out)};
 chipGroup(box,'ขนาด',RATIOS.map(x=>[x[0],x[2]]),()=>st.ratio,v=>{st.ratio=v;draw()});
 chipGroup(box,'สีขอบ',BGS,()=>st.bg,v=>{st.bg=v;draw()});
 chipGroup(box,'ขอบ',[[0,'เต็มภาพ'],[.04,'บาง'],[.06,'กลาง'],[.1,'หนา']],()=>st.margin,v=>{st.margin=v;draw()});
 const save=el('<button class="bigbtn">💾 บันทึกลงอัลบั้ม</button>'),share=el('<button class="bigbtn sec">📤 แชร์ไป IG / แอปอื่น</button>');
 save.onclick=async()=>{const blob=await toBlob(out,.94);const rec=await addRecord({kind:'post',blob});closeSheet();await openGallery();openViewer(rec);toast('บันทึกแล้ว')};
 share.onclick=async()=>{const blob=await toBlob(out,.94);shareBlob(blob,`FilmCam_post_${Date.now()}.jpg`)};
 box.appendChild(save);box.appendChild(share);
 openSheet('จัดรูปลง IG',box);draw();
}
/* collage layouts */
function layoutGrid(imgs,ratio,bg){
 const W=1080,H=Math.round(W/ratio),c=mk(W,H),x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,W,H);
 const n=imgs.length,cols=n<=4?2:3,rows=Math.ceil(n/cols),gap=W*.02,cw=(W-gap*(cols+1))/cols,ch=(H-gap*(rows+1))/rows;
 imgs.forEach((im,i)=>{const r=Math.floor(i/cols),inRow=Math.min(cols,n-r*cols),off=(cols-inRow)*(cw+gap)/2,cI=i%cols;coverDraw(x,im,gap+off+cI*(cw+gap),gap+r*(ch+gap),cw,ch)});
 return c;
}
function layoutStrip(imgs,ratio,bg){
 const n=imgs.length,fw=800,fh=560,side=120,gy=36,CW=fw+2*side,CH=n*fh+(n+1)*gy,s=mk(CW,CH),x=s.getContext('2d');
 x.fillStyle='#0d0b0a';x.fillRect(0,0,CW,CH);
 x.fillStyle='rgba(243,239,230,.92)';const hw=40,hh=28;
 for(let y=18;y<CH-hh;y+=62){[side/2-hw/2,CW-side/2-hw/2].forEach(hx=>{x.beginPath();x.roundRect?x.roundRect(hx,y,hw,hh,6):x.rect(hx,y,hw,hh);x.fill()})}
 x.font='700 22px ui-monospace,Menlo,monospace';x.textBaseline='middle';
 imgs.forEach((im,i)=>{const y=gy+i*(fh+gy);coverDraw(x,im,side,y,fw,fh);x.fillStyle='#f29a3a';x.save();x.translate(side-16,y+fh-30);x.rotate(-Math.PI/2);x.fillText(`${i+1}A`,0,0);x.restore()});
 return composePost(s,ratio,bg,.06);
}
function layoutDump(imgs,ratio,bg,seed){
 const W=1080,H=Math.round(W/ratio),c=mk(W,H),x=c.getContext('2d'),R=rng(seed);x.fillStyle=bg;x.fillRect(0,0,W,H);
 const n=imgs.length,cols=n<=2?1:n<=4?2:3,rows=Math.ceil(n/cols),cw=W/cols,ch=H/rows,pw=Math.min(cw,ch)*(n<=2?.85:.95);
 imgs.forEach((im,i)=>{
  const r=Math.floor(i/cols),cI=i%cols,cx=cw*(cI+.5)+(R()-.5)*cw*.18,cy=ch*(r+.5)+(R()-.5)*ch*.15,b=pw*.05,bb=pw*.2,ph=pw-2*b;
  x.save();x.translate(cx,cy);x.rotate((R()-.5)*.3);x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=pw*.06;x.shadowOffsetY=pw*.02;
  const fh=b+ph+bb;x.fillStyle='#f6f3ec';x.fillRect(-pw/2,-fh/2,pw,fh);x.shadowColor='transparent';
  coverDraw(x,im,-pw/2+b,-fh/2+b,ph,ph);x.restore();
 });
 return c;
}
async function openCollage(recs){
 const imgs=await Promise.all(recs.map(r=>blobToBmp(r.blob))),st={layout:'grid',ratio:'4:5',bg:'#ffffff',seed:newSeed()};
 const box=el('<div class="rows" style="padding-top:0"></div>'),prev=el('<div class="prev"></div>');box.appendChild(prev);
 let out=null;
 const draw=()=>{const ra=RATIOS.find(x=>x[0]===st.ratio)[1];out=st.layout==='grid'?layoutGrid(imgs,ra,st.bg):st.layout==='strip'?layoutStrip(imgs,ra,st.bg):layoutDump(imgs,ra,st.bg,st.seed);prev.innerHTML='';prev.appendChild(out)};
 chipGroup(box,'แบบ',[['grid','กริด'],['strip','แถบฟิล์ม'],['dump','โพลารอยด์กระจาย']],()=>st.layout,v=>{st.layout=v;draw()});
 chipGroup(box,'ขนาด',RATIOS.map(x=>[x[0],x[2]]),()=>st.ratio,v=>{st.ratio=v;draw()});
 chipGroup(box,'พื้นหลัง',BGS,()=>st.bg,v=>{st.bg=v;draw()});
 const shuffle=el('<button class="bigbtn sec">🎲 สุ่มตำแหน่งโพลารอยด์ใหม่</button>');shuffle.onclick=()=>{st.seed=newSeed();if(st.layout!=='dump'){st.layout='dump'}draw()};
 const save=el('<button class="bigbtn">💾 บันทึกลงอัลบั้ม</button>'),share=el('<button class="bigbtn sec">📤 แชร์</button>');
 save.onclick=async()=>{const blob=await toBlob(out,.94);const rec=await addRecord({kind:'collage',blob});closeSheet();setSel(false);openViewer(rec);toast('บันทึกภาพรวมแล้ว')};
 share.onclick=async()=>{const blob=await toBlob(out,.94);shareBlob(blob,`FilmCam_dump_${Date.now()}.jpg`)};
 box.appendChild(shuffle);box.appendChild(save);box.appendChild(share);
 openSheet(`รวม ${recs.length} รูป`,box);draw();
}

setInterval(()=>{$('stamp').textContent=dateStr(stampDate());loadThumb();if($('gallery').classList.contains('open')&&!selMode)openGallery()},60000);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
